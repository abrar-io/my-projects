<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Social Links Profile</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- ===================================================================
         البطاقة
         كل ما تحتاج إلى تعديله معلَّم بتعليق "غيّرني".
         تحتاج فقط إلى تعديل النصوص والروابط في الأسفل — بدون إضافة
         أو حذف أي عناصر.
    ==================================================================== -->
    <main class="card">
      <!-- غيّرني: صورتك الشخصية.
           ضع ملف صورتك في هذا المجلد ثم عدّل قيمة src.
           مثال: src="my-photo.jpg" -->
      <img class="avatar" src="OIP (2).webp" alt="Profile picture" />

      <!-- غيّرني: اسمك -->
      <h1 class="name">Abrar Samel</h1>

      <!-- غيّرني: موقعك (مدينتك ودولتك) -->
      <p class="location">Saudi Arabia</p>

      <!-- غيّرني: سطر قصير يعرّف بك -->
      <p class="bio">
        "A person who loves learning and self-development, always striving to
        make an impact in the tech field."
      </p>

      <!-- الروابط.
           غيّرني: لكل رابط، عدّل النص بين الوسمين
           (مثل "GitHub") وعدّل عنوان الموقع في href="...". -->
      <nav class="links">
        <a
          class="link"
          href="https://www.linkedin.com/in/abrar-alsubaie-441824399/"
          >LinkedIn</a
        >
        <a class="link" href="https://github.com/abraralsubaie01-wq">GitHub</a>
        <a class="link" href="mailto:abraralsubaie01@gmail.com">gmail</a>
      </nav>
    </main>
  </body>
</html>
